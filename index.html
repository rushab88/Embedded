<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Embedded Signup</title>
</head>

<body>

    <h2>Connect WhatsApp Business</h2>

    <button onclick="launchWhatsAppSignup()">
        Connect WhatsApp Business
    </button>

    <script>
        window.fbAsyncInit = function () {
            FB.init({
                appId: '2864773260548283',
                cookie: true,
                xfbml: true,
                version: 'v26.0'
            });

            FB.AppEvents.logPageView();
        };

        function launchWhatsAppSignup() {

           FB.login(function (response) {
    console.log("Facebook Login Response:", response);

    if (response.authResponse && response.authResponse.code) {
        const code = response.authResponse.code;
        console.log("Embedded Signup authorization code received.");
        console.log(code);
    }
}, {
    config_id: "1113643111245718",
    response_type: "code",
    override_default_response_type: true,
    extras: {
        setup: {}
    }
});
        }
    </script>

    <!-- Facebook SDK -->
    <script async defer crossorigin="anonymous"
        src="https://connect.facebook.net/en_US/sdk.js">
    </script>

</body>
</html>
